<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up / Login — Dimple Star Transport</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: var(--navy); }
    .auth-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 16px;
      background: var(--navy);
      position: relative;
      overflow: hidden;
    }
    .auth-wrap::before {
      content:'';
      position:absolute; inset:0;
      background: repeating-linear-gradient(-45deg, transparent 0, transparent 24px, rgba(232,160,32,.06) 24px, rgba(232,160,32,.06) 25px);
    }
    .auth-card {
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0,0,0,.4);
      width: 100%; max-width: 440px;
      position: relative;
      overflow: hidden;
    }
    .auth-tabs { display: flex; border-bottom: 2px solid #EAEDF3; }
    .auth-tab {
      flex: 1; padding: 18px; text-align: center;
      font-family:'Syne',sans-serif; font-weight:700; font-size:15px;
      color: var(--gray); cursor: pointer; transition: .2s;
      border-bottom: 3px solid transparent; margin-bottom:-2px;
    }
    .auth-tab.active { color: var(--navy); border-bottom-color: var(--gold); }
    .auth-body { padding: 32px; }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo .icon { font-size: 40px; }
    .auth-logo h2 { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; color:var(--navy); margin-top:8px; }
    .auth-logo p { color:var(--gray); font-size:14px; }

    .panel { display: none; }
    .panel.active { display: block; }

    .demo-hint {
      background: rgba(232,160,32,.1); border: 1px solid rgba(232,160,32,.3);
      border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--gold-dk);
      margin-bottom: 20px; line-height: 1.5;
    }
    .back-home { display:block; text-align:center; margin-top:16px; color:rgba(255,255,255,.6); font-size:13px; text-decoration:none; }
    .back-home:hover { color:var(--gold-lt); }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div style="width:100%;max-width:440px;position:relative;">
    <div class="auth-card">
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</div>
        <div class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
      </div>

      <div class="auth-body">
        <div class="auth-logo">
          <div class="icon">🚌</div>
          <h2>Dimple Star Transport</h2>
          <p>Your journey starts here</p>
        </div>

        <!-- LOGIN -->
        <div class="panel active" id="panel-login">
          <div class="demo-hint">
            <strong>Demo accounts:</strong><br>
            test@example.com / password123<br>
            juan@gmail.com / juan2024
          </div>
          <div id="login-error" class="alert alert-error">Invalid email or password. Please try again.</div>
          <div class="field">
            <label>Email Address</label>
            <input type="email" id="login-email" placeholder="your@email.com" />
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()" />
          </div>
          <button class="btn btn-primary btn-full" onclick="doLogin()">Login</button>
        </div>

        <!-- SIGNUP -->
        <div class="panel" id="panel-signup">
          <div id="signup-error" class="alert alert-error">That email is already registered.</div>
          <div id="signup-success" class="alert alert-success">Account created! You are now logged in.</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="field">
              <label>First Name</label>
              <input type="text" id="reg-fname" placeholder="Juan" />
            </div>
            <div class="field">
              <label>Last Name</label>
              <input type="text" id="reg-lname" placeholder="dela Cruz" />
            </div>
          </div>
          <div class="field">
            <label>Email Address</label>
            <input type="email" id="reg-email" placeholder="your@email.com" />
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="reg-pass" placeholder="At least 6 characters" />
          </div>
          <button class="btn btn-primary btn-full" onclick="doSignup()">Create Account</button>
        </div>
      </div>
    </div>
    <a href="index.html" class="back-home">← Back to Home</a>
  </div>
</div>

<script src="data.js"></script>
<script>
  // If already logged in, redirect home
  if (getSession()) location.href = 'index.html';

  function switchTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    document.getElementById('panel-login').classList.toggle('active', tab === 'login');
    document.getElementById('panel-signup').classList.toggle('active', tab === 'signup');
  }

  function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-pass').value;
    const err   = document.getElementById('login-error');
    if (login(email, pass)) {
      location.href = 'index.html';
    } else {
      err.classList.add('show');
    }
  }

  function doSignup() {
    const fname = document.getElementById('reg-fname').value.trim();
    const lname = document.getElementById('reg-lname').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass  = document.getElementById('reg-pass').value;
    const err   = document.getElementById('signup-error');
    const ok    = document.getElementById('signup-success');
    err.classList.remove('show');
    ok.classList.remove('show');
    if (!fname || !lname || !email || pass.length < 6) {
      err.textContent = 'Please fill in all fields. Password must be 6+ characters.';
      err.classList.add('show'); return;
    }
    if (register(fname, lname, email, pass)) {
      ok.classList.add('show');
      setTimeout(() => location.href = 'index.html', 1200);
    } else {
      err.textContent = 'That email is already registered. Please login instead.';
      err.classList.add('show');
    }
  }
</script>
</body>
</html>
